<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" id="img-gallery-light" fill="none" stroke="currentColor">
  <!-- Group style taaki Elementor se inherit ho aur sab kuch heavily rounded rahe -->
  <g style="stroke-width: 20; stroke-linecap: round; stroke-linejoin: round;">

    <!-- Pichhe wali photo ka frame (Jo top-right se jhaank raha hai) -->
    <path d="M 256 200 V 176 A 96 96 0 0 1 352 80 H 464 A 96 96 0 0 1 560 176 V 288 A 96 96 0 0 1 464 384 H 440" />

    <!-- Aage wali photo ka main frame (Massive 96px rounded corners for a premium feel) -->
    <rect x="80" y="200" width="360" height="360" rx="96" />

    <!-- Minimalist Sun / Moon -->
    <circle cx="304" cy="304" r="32" />

    <!-- Elegant Smooth Hills (Sharp triangle wale pahaad ki jagah smooth flow) -->
    <path d="M 80 432 C 160 352, 224 352, 280 416 C 336 480, 392 464, 440 400" />

  </g>
</svg>
