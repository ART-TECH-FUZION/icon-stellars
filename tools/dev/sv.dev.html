<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteForge — SVG Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #06060b;
            --bg-raised: #0c0c14;
            --bg-card: #10101a;
            --bg-input: #0a0a12;
            --fg: #e4e4ef;
            --fg-dim: #9090a8;
            --fg-muted: #4e4e68;
            --accent: #c9a44c;
            --accent-bright: #e0be5e;
            --accent-glow: rgba(201, 164, 76, 0.12);
            --accent-glow2: rgba(201, 164, 76, 0.06);
            --border: #1a1a2a;
            --border-hover: #2a2a40;
            --error: #e85454;
            --error-bg: rgba(232, 84, 84, 0.07);
            --success: #4cce8a;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --shadow: 0 12px 48px rgba(0,0,0,0.6);
            --font-ui: 'Space Grotesk', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::selection { background: rgba(201,164,76,0.25); color: var(--accent-bright); }

        /* === AMBIENT BG === */
        .ambient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 50% 40% at 20% 10%, rgba(201,164,76,0.04) 0%, transparent 70%),
                radial-gradient(ellipse 40% 50% at 80% 85%, rgba(160,120,50,0.03) 0%, transparent 70%),
                radial-gradient(ellipse 60% 30% at 50% 50%, rgba(100,80,200,0.015) 0%, transparent 60%);
        }
        .noise {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }

        /* === APP SHELL === */
        .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

        /* === HEADER === */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 56px; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: rgba(6,6,11,0.8);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .logo { display: flex; align-items: center; gap: 11px; }
        .logo-mark {
            width: 32px; height: 32px; border-radius: var(--radius-xs);
            background: linear-gradient(135deg, var(--accent), #a07828);
            display: grid; place-items: center;
            color: var(--bg); font-size: 14px;
            box-shadow: 0 0 18px rgba(201,164,76,0.2);
        }
        .logo-name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.4px; }
        .logo-name span { color: var(--accent); }

        .header-actions { display: flex; align-items: center; gap: 6px; }

        /* === BUTTONS === */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-xs);
            background: var(--bg-card); color: var(--fg-dim);
            font-family: var(--font-ui); font-size: 0.78rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .btn:hover { border-color: var(--border-hover); color: var(--fg); background: var(--bg-raised); }
        .btn:active { transform: scale(0.97); }
        .btn--gold {
            background: linear-gradient(135deg, var(--accent), #a07828);
            border-color: transparent; color: var(--bg); font-weight: 600;
            box-shadow: 0 2px 20px rgba(201,164,76,0.18);
        }
        .btn--gold:hover { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: var(--bg); border-color: transparent; box-shadow: 0 4px 28px rgba(201,164,76,0.3); }
        .btn--red { border-color: rgba(232,84,84,0.25); color: var(--error); }
        .btn--red:hover { background: var(--error-bg); border-color: var(--error); }
        .btn--icon { padding: 7px 8px; min-width: 32px; justify-content: center; }
        .btn--xs { padding: 5px 10px; font-size: 0.72rem; }

        /* === MAIN GRID === */
        .workspace {
            flex: 1; display: grid; min-height: 0;
            grid-template-columns: 1fr 1.3fr;
            grid-template-rows: auto 1fr auto;
            gap: 0;
        }

        /* === TOOLBAR STRIP === */
        .toolbar-strip {
            grid-column: 1 / -1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 24px; gap: 10px; flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            background: rgba(12,12,20,0.5);
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 6px; }
        .sep { width: 1px; height: 20px; background: var(--border); }
        .kbd-hint { font-size: 0.68rem; color: var(--fg-muted); font-family: var(--font-code); }
        kbd { padding: 1px 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; font-family: var(--font-code); font-size: 0.6rem; color: var(--fg-muted); }

        /* === PANELS === */
        .panel {
            display: flex; flex-direction: column; min-height: 0; overflow: hidden;
            border-right: 1px solid var(--border);
        }
        .panel:last-of-type { border-right: none; }

        .panel-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; height: 40px; flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.15);
        }
        .panel-label {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--fg-muted);
        }
        .panel-label i { color: var(--accent); font-size: 0.8rem; }
        .panel-tag {
            font-family: var(--font-code); font-size: 0.62rem; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: var(--accent-glow); color: var(--accent);
        }

        .panel-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* === CODE EDITOR === */
        .editor-wrap { flex: 1; display: flex; min-height: 0; overflow: hidden; }
        .line-nums {
            width: 44px; padding: 14px 6px 14px 0; text-align: right;
            font-family: var(--font-code); font-size: 0.72rem; line-height: 1.75;
            color: var(--fg-muted); background: var(--bg-input);
            border-right: 1px solid var(--border); overflow: hidden; user-select: none; flex-shrink: 0;
            opacity: 0.5;
        }
        .code-area {
            flex: 1; padding: 14px 16px; background: var(--bg-input); color: var(--fg);
            font-family: var(--font-code); font-size: 0.78rem; line-height: 1.75;
            border: none; outline: none; resize: none; tab-size: 2; white-space: pre; overflow: auto;
        }
        .code-area::placeholder { color: var(--fg-muted); font-style: italic; }
        .code-area::-webkit-scrollbar { width: 6px; height: 6px; }
        .code-area::-webkit-scrollbar-track { background: transparent; }
        .code-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .code-area::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

        .error-strip {
            display: none; align-items: center; gap: 8px;
            padding: 8px 18px; background: var(--error-bg);
            border-top: 1px solid rgba(232,84,84,0.15); color: var(--error); font-size: 0.78rem; flex-shrink: 0;
        }
        .error-strip.show { display: flex; }
        .error-strip i { flex-shrink: 0; font-size: 0.85rem; }
        .error-strip p { flex: 1; line-height: 1.5; }

        /* === PREVIEW === */
        .preview-zone {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 24px; overflow: auto; position: relative;
            background: var(--bg-input);
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.012) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.012) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.012) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.012) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }
        .preview-zone.bg-light { background: #f2f0eb; background-image: none; }
        .preview-zone.bg-checker {
            background: #1a1a2e;
            background-image:
                linear-gradient(45deg, #22223a 25%, transparent 25%),
                linear-gradient(-45deg, #22223a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #22223a 75%),
                linear-gradient(-45deg, transparent 75%, #22223a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        .preview-zone.bg-custom { background-image: none !important; }

        .preview-inner {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            transition: transform 0.25s ease; position: relative; z-index: 1;
        }
        .preview-inner svg { max-width: 100%; max-height: 100%; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            color: var(--fg-muted); text-align: center; position: relative; z-index: 1;
        }
        .empty-state i { font-size: 2.5rem; opacity: 0.3; }
        .empty-state p { font-size: 0.85rem; max-width: 220px; line-height: 1.6; opacity: 0.6; }

        /* === SPRITE GRID === */
        .sprite-grid {
            display: none; flex-wrap: wrap; gap: 10px; padding: 16px;
            border-top: 1px solid var(--border); background: rgba(0,0,0,0.15);
            overflow-y: auto; flex-shrink: 0; max-height: 200px;
        }
        .sprite-grid.show { display: flex; }
        .sprite-grid::-webkit-scrollbar { width: 4px; }
        .sprite-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sprite-card {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 12px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--bg-card);
            cursor: pointer; transition: all 0.2s ease; min-width: 80px;
        }
        .sprite-card:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(201,164,76,0.08); }
        .sprite-card.active { border-color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(201,164,76,0.12); }
        .sprite-card svg { width: 28px; height: 28px; color: var(--fg); }
        .sprite-card-label { font-family: var(--font-code); font-size: 0.65rem; color: var(--fg-muted); text-align: center; word-break: break-all; max-width: 90px; }
        .sprite-card.active .sprite-card-label { color: var(--accent); }

        /* === PREVIEW FOOTER === */
        .preview-foot {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 18px; border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.15); flex-shrink: 0;
        }
        .zoom-group { display: flex; align-items: center; gap: 4px; }
        .zoom-val { font-family: var(--font-code); font-size: 0.7rem; color: var(--fg-dim); min-width: 42px; text-align: center; }
        .meta-text { font-family: var(--font-code); font-size: 0.65rem; color: var(--fg-muted); }

        .bg-pills { display: flex; border: 1px solid var(--border); border-radius: var(--radius-xs); overflow: hidden; }
        .bg-pill {
            padding: 5px 9px; background: none; border: none; color: var(--fg-muted);
            cursor: pointer; font-size: 0.72rem; transition: all 0.15s ease;
        }
        .bg-pill.on { background: var(--accent-glow); color: var(--accent); }
        .bg-pill:hover:not(.on) { color: var(--fg-dim); }

        /* === STATUS BAR === */
        .statusbar {
            grid-column: 1 / -1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: 28px; flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: rgba(6,6,11,0.9);
            font-family: var(--font-code); font-size: 0.65rem; color: var(--fg-muted);
        }
        .statusbar-left, .statusbar-right { display: flex; align-items: center; gap: 14px; }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--success);
            box-shadow: 0 0 6px rgba(76,206,138,0.5);
        }
        .status-dot.err { background: var(--error); box-shadow: 0 0 6px rgba(232,84,84,0.5); }

        /* === TOAST === */
        .toast-box { position: fixed; bottom: 40px; right: 24px; z-index: 999; display: flex; flex-direction: column-reverse; gap: 6px; }
        .toast {
            display: flex; align-items: center; gap: 9px;
            padding: 10px 16px; border-radius: var(--radius-sm);
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--fg); font-size: 0.8rem; box-shadow: var(--shadow);
            animation: tIn 0.3s cubic-bezier(0.16,1,0.3,1);
            backdrop-filter: blur(12px);
        }
        .toast.ok i { color: var(--success); }
        .toast.err i { color: var(--error); }
        .toast.inf i { color: var(--accent); }
        .toast.out { animation: tOut 0.25s ease forwards; }
        @keyframes tIn { from { opacity:0; transform: translateY(12px) scale(0.96); } to { opacity:1; transform: translateY(0) scale(1); } }
        @keyframes tOut { to { opacity:0; transform: translateY(8px) scale(0.96); } }

        /* === SAMPLE DROPDOWN === */
        .dd { position: relative; }
        .dd-menu {
            display: none; position: absolute; top: calc(100% + 5px); left: 0;
            min-width: 200px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            z-index: 200; padding: 5px; animation: ddIn 0.15s ease;
        }
        .dd-menu.open { display: block; }
        @keyframes ddIn { from { opacity:0; transform: translateY(-3px); } to { opacity:1; transform: translateY(0); } }
        .dd-item {
            display: flex; align-items: center; gap: 9px; width: 100%;
            padding: 9px 11px; background: none; border: none; border-radius: var(--radius-xs);
            color: var(--fg-dim); font-family: var(--font-ui); font-size: 0.8rem;
            cursor: pointer; transition: all 0.12s ease;
        }
        .dd-item:hover { background: var(--accent-glow); color: var(--fg); }
        .dd-item i { width: 18px; text-align: center; color: var(--accent); font-size: 0.8rem; }

        /* === COLOR PICKER === */
        .color-picker-wrap {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs);
            background: var(--bg-card); cursor: pointer; transition: all 0.2s ease;
        }
        .color-picker-wrap:hover { border-color: var(--border-hover); }
        .color-picker-wrap input[type="color"] {
            width: 22px; height: 22px; border: none; border-radius: 50%;
            background: none; cursor: pointer; padding: 0; appearance: none;
        }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-wrap input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 50%; }
        .color-picker-wrap span { font-size: 0.72rem; color: var(--fg-dim); }

        /* === RESPONSIVE === */
        @media (max-width: 860px) {
            .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .panel { border-right: none; border-bottom: 1px solid var(--border); }
            .panel:last-of-type { border-bottom: none; }
            .btn span.hm { display: none; }
            header { padding: 0 14px; }
            .toolbar-strip { padding: 8px 14px; }
            .statusbar { padding: 0 14px; }
        }
        @media (max-width: 520px) {
            header { height: 48px; }
            .logo-name { font-size: 0.95rem; }
            .logo-mark { width: 28px; height: 28px; font-size: 12px; }
            .btn { padding: 6px 10px; font-size: 0.72rem; }
            .toolbar-strip { padding: 6px 10px; gap: 4px; }
            .toolbar-left { flex-wrap: wrap; }
            .kbd-hint { display: none; }
            .panel-head { padding: 0 12px; height: 36px; }
            .preview-foot { padding: 6px 12px; }
            .statusbar { height: 24px; font-size: 0.6rem; }
            .code-area { font-size: 0.72rem; padding: 10px 12px; }
            .line-nums { width: 36px; font-size: 0.68rem; padding: 10px 4px 10px 0; }
            .sprite-grid { padding: 10px; gap: 8px; }
            .sprite-card { padding: 10px 12px; min-width: 70px; }
            .toast-box { bottom: 20px; right: 12px; }
        }
        @media (max-width: 380px) {
            .btn span.hm { display: none; }
            .toolbar-left .btn { padding: 5px 7px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="ambient"></div>
    <div class="noise"></div>

    <div class="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <div class="logo-mark"><i class="fa-solid fa-vector-square"></i></div>
                <div class="logo-name">Sprite<span>Forge</span></div>
            </div>
            <div class="header-actions">
                <div class="dd">
                    <button class="btn" id="sampleBtn" aria-label="Load sample">
                        <i class="fa-solid fa-flask"></i><span class="hm">Samples</span>
                        <i class="fa-solid fa-chevron-down" style="font-size:0.55rem;opacity:0.5;"></i>
                    </button>
                    <div class="dd-menu" id="sampleMenu" role="menu">
                        <button class="dd-item" data-s="icons"><i class="fa-solid fa-icons"></i>Icon Sprite Set</button>
                        <button class="dd-item" data-s="logo"><i class="fa-solid fa-star"></i>Logo Design</button>
                        <button class="dd-item" data-s="illustration"><i class="fa-solid fa-palette"></i>Illustration</button>
                        <button class="dd-item" data-s="pattern"><i class="fa-solid fa-border-all"></i>Pattern Tile</button>
                    </div>
                </div>
                <button class="btn" id="fmtBtn" aria-label="Format"><i class="fa-solid fa-align-left"></i><span class="hm">Format</span></button>
                <button class="btn btn--gold" id="prevBtn" aria-label="Preview"><i class="fa-solid fa-eye"></i><span class="hm">Preview</span></button>
            </div>
        </header>

        <!-- Workspace Grid -->
        <div class="workspace">
            <!-- Toolbar -->
            <div class="toolbar-strip">
                <div class="toolbar-left">
                    <button class="btn btn--red btn--xs" id="clearBtn"><i class="fa-solid fa-trash-can"></i><span class="hm">Clear</span></button>
                    <button class="btn btn--xs" id="copyBtn"><i class="fa-regular fa-copy"></i><span class="hm">Copy</span></button>
                    <div class="sep"></div>
                    <button class="btn btn--xs" id="dlSvg"><i class="fa-solid fa-download"></i><span class="hm">SVG</span></button>
                    <button class="btn btn--xs" id="dlPng"><i class="fa-solid fa-image"></i><span class="hm">PNG</span></button>
                    <div class="sep"></div>
                    <button class="btn btn--xs" id="minifyBtn"><i class="fa-solid fa-compress"></i><span class="hm">Minify</span></button>
                </div>
                <div class="toolbar-right">
                    <span class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Preview</span>
                </div>
            </div>

            <!-- Code Panel -->
            <div class="panel">
                <div class="panel-head">
                    <div class="panel-label"><i class="fa-solid fa-code"></i>SVG Code</div>
                    <div class="panel-tag" id="charTag">0 chars</div>
                </div>
                <div class="panel-body">
                    <div class="editor-wrap">
                        <div class="line-nums" id="ln" aria-hidden="true">1</div>
                        <textarea class="code-area" id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
                            placeholder="Paste your SVG sprite code here..." aria-label="SVG code editor"></textarea>
                    </div>
                    <div class="error-strip" id="errBar"><i class="fa-solid fa-circle-exclamation"></i><p id="errTxt"></p></div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="panel">
                <div class="panel-head">
                    <div class="panel-label"><i class="fa-solid fa-eye"></i>Preview</div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div class="bg-pills" id="bgPills">
                            <button class="bg-pill on" data-bg="dark" title="Dark"><i class="fa-solid fa-moon"></i></button>
                            <button class="bg-pill" data-bg="light" title="Light"><i class="fa-solid fa-sun"></i></button>
                            <button class="bg-pill" data-bg="checker" title="Checkerboard"><i class="fa-solid fa-chess-board"></i></button>
                        </div>
                        <div class="color-picker-wrap" title="Custom background color">
                            <input type="color" id="customBgPicker" value="#06060b">
                            <span>Custom</span>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="preview-zone" id="pz">
                        <div class="empty-state" id="emptyState">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <p>Paste SVG code or choose a sample</p>
                        </div>
                        <div class="preview-inner" id="pvInner" style="display:none;"></div>
                    </div>
                    <!-- All symbols grid -->
                    <div class="sprite-grid" id="sGrid"></div>
                </div>
                <div class="preview-foot">
                    <div class="zoom-group">
                        <button class="btn btn--icon btn--xs" id="zOut" aria-label="Zoom out"><i class="fa-solid fa-minus"></i></button>
                        <span class="zoom-val" id="zVal">100%</span>

        /* === Line numbers === */
        function updLn() {
            const n = editor.value.split('\n').length;
            let t = '';
            for (let i = 1; i <= n; i++) t += i + '\n';
            ln.textContent = t;
            charTag.textContent = editor.value.length + ' chars';
        }

        editor.addEventListener('scroll', () => { ln.scrollTop = editor.scrollTop; });
        editor.addEventListener('input', () => {
            updLn();
            clearTimeout(debounce);
            debounce = setTimeout(() => render(editor.value), 350);
        });
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = editor.selectionStart, end = editor.selectionEnd;
                editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = s + 2;
                updLn();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(editor.value); }
        });

        /* === RENDER === */
        function render(svg) {
            if (!svg.trim()) {
                emptyState.style.display = 'flex'; pvInner.style.display = 'none';
                sGrid.classList.remove('show'); errBar.classList.remove('show');
                sDot.classList.remove('err'); sTxt.textContent = 'Ready';
                sDim.textContent = '--'; metaTxt.textContent = '--'; curSvg = ''; symbols = [];
                return;
            }
            try {
                const doc = new DOMParser().parseFromString(svg.trim(), 'image/svg+xml');
                if (doc.querySelector('parsererror')) throw new Error(doc.querySelector('parsererror').textContent.substring(0, 120));
                const root = doc.documentElement;
                if (root.tagName.toLowerCase() !== 'svg') throw new Error('Root <' + root.tagName + '> found, expected <svg>');

                symbols = Array.from(root.querySelectorAll('symbol')).map(s => s.id);

                /* If sprite (symbols + display:none) show all in grid */
                if (symbols.length > 0 && (root.style.display === 'none' || root.getAttribute('style')?.includes('display:none'))) {
                    showAllSymbols(svg, symbols);
                } else {
                    /* Normal SVG — direct preview */
                    pvInner.innerHTML = svg.trim();
                    pvInner.style.display = 'flex';
                    emptyState.style.display = 'none';
                    sGrid.classList.remove('show');
                    setDim(pvInner.querySelector('svg'));
                    metaTxt.textContent = symbols.length ? symbols.length + ' symbols' : 'Single SVG';
                }

                pvInner.style.transform = 'scale(' + zoom + ')';
                errBar.classList.remove('show');
                sDot.classList.remove('err'); sTxt.textContent = 'Parsed OK';
                curSvg = svg.trim();
            } catch (e) {
                errBar.classList.add('show'); errTxt.textContent = e.message;
                sDot.classList.add('err'); sTxt.textContent = 'Error';
                emptyState.style.display = 'flex'; pvInner.style.display = 'none';
                sGrid.classList.remove('show'); curSvg = ''; symbols = [];
            }
        }

        /* === ALL SYMBOLS GRID === */
        function showAllSymbols(svg, syms) {
            sGrid.innerHTML = '';
            const parser = new DOMParser();

            syms.forEach((id, i) => {
                const doc = parser.parseFromString(svg, 'image/svg+xml');
                const sym = doc.getElementById(id);
                if (!sym) return;
                const vb = sym.getAttribute('viewBox') || '0 0 24 24';
                const kids = Array.from(sym.childNodes).map(n => n.outerHTML || n.textContent).filter(Boolean).join('\n    ');

                /* Card with inline children for preview */
                const cardSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="28" height="28">${kids}</svg>`;

                const card = document.createElement('div');
                card.className = 'sprite-card' + (i === 0 ? ' active' : '');
                card.innerHTML = cardSvg + '<span class="sprite-card-label">' + id + '</span>';

                card.addEventListener('click', () => {
                    sGrid.querySelectorAll('.sprite-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    /* Individual preview */
                    const pvSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="200" height="200">${kids}</svg>`;
                    pvInner.innerHTML = pvSvg;
                    pvInner.style.display = 'flex';
                    emptyState.style.display = 'none';
                    pvInner.style.transform = 'scale(' + zoom + ')';
                    setDim(pvInner.querySelector('svg'));
                });
                sGrid.appendChild(card);
            });

            sGrid.classList.add('show');

            /* First symbol in main preview */
            if (syms.length > 0) {
                const doc = parser.parseFromString(svg, 'image/svg+xml');
                const sym = doc.getElementById(syms[0]);
                if (sym) {
                    const vb = sym.getAttribute('viewBox') || '0 0 24 24';
                    const kids = Array.from(sym.childNodes).map(n => n.outerHTML || n.textContent).filter(Boolean).join('\n    ');
                    pvInner.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="200" height="200">${kids}</svg>`;
                    pvInner.style.display = 'flex'; emptyState.style.display = 'none';
                    setDim(pvInner.querySelector('svg'));
                }
            }

            metaTxt.textContent = syms.length + ' symbols';
        }

        function setDim(el) {
            if (!el) return;
            const w = el.getAttribute('width') || (el.viewBox?.baseVal?.width ? Math.round(el.viewBox.baseVal.width) : '?');
            const h = el.getAttribute('height') || (el.viewBox?.baseVal?.height ? Math.round(el.viewBox.baseVal.height) : '?');
            sDim.textContent = w + ' \u00d7 ' + h;
        }

        /* === Zoom === */
        function setZ(z) { zoom = Math.max(0.1, Math.min(5, z)); zVal.textContent = Math.round(zoom * 100) + '%'; pvInner.style.transform = 'scale(' + zoom + ')'; }
        document.getElementById('zIn').onclick = () => setZ(zoom + 0.25);
        document.getElementById('zOut').onclick = () => setZ(zoom - 0.25);
        document.getElementById('zRst').onclick = () => setZ(1);
        pz.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZ(zoom + (e.deltaY > 0 ? -0.1 : 0.1)); } }, { passive: false });

        /* === BG Toggle + Custom Color === */
        document.getElementById('bgPills').addEventListener('click', (e) => {
            const b = e.target.closest('.bg-pill'); if (!b) return;
            document.querySelectorAll('.bg-pill').forEach(p => p.classList.remove('on'));
            b.classList.add('on');
            currentBgMode = b.dataset.bg;
            applyBg();
        });

        customBgPicker.addEventListener('input', () => {
            document.querySelectorAll('.bg-pill').forEach(p => p.classList.remove('on'));
            currentBgMode = 'custom';
            applyBg();
        });

        function applyBg() {
            pz.className = 'preview-zone';
            pz.style.background = '';
            if (currentBgMode === 'light') pz.classList.add('bg-light');
            else if (currentBgMode === 'checker') pz.classList.add('bg-checker');
            else if (currentBgMode === 'custom') {
                pz.classList.add('bg-custom');
                pz.style.background = customBgPicker.value;
            }
        }

        /* === Buttons === */
        document.getElementById('prevBtn').onclick = () => render(editor.value);

        document.getElementById('clearBtn').onclick = () => {
            editor.value = ''; updLn(); render(''); toast('Code cleared', 'ok');
        };

        document.getElementById('copyBtn').onclick = () => {
            if (!editor.value.trim()) { toast('Paste code first', 'inf'); return; }
            navigator.clipboard.writeText(editor.value).then(() => toast('Copied to clipboard', 'ok')).catch(() => { editor.select(); document.execCommand('copy'); toast('Copied', 'ok'); });
        };

        document.getElementById('dlSvg').onclick = () => {
            if (!curSvg) { toast('Preview first', 'inf'); return; }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([curSvg], { type: 'image/svg+xml' }));
            a.download = 'sprite.svg'; a.click(); toast('SVG downloading', 'ok');
        };

        document.getElementById('dlPng').onclick = () => {
            if (!curSvg) { toast('Preview first', 'inf'); return; }
            const url = URL.createObjectURL(new Blob([curSvg], { type: 'image/svg+xml;charset=utf-8' }));
            const img = new Image();
            img.onload = () => {
                const s = 2; expCvs.width = img.naturalWidth * s; expCvs.height = img.naturalHeight * s;
                const ctx = expCvs.getContext('2d'); ctx.scale(s, s); ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                expCvs.toBlob(b => {
                    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
                    a.download = 'sprite.png'; a.click(); toast('PNG export (2x)', 'ok');
                });
            };
            img.onerror = () => { URL.revokeObjectURL(url); toast('PNG export failed', 'err'); };
            img.src = url;
        };

        /* === Format === */
        document.getElementById('fmtBtn').onclick = () => {
            if (!editor.value.trim()) { toast('Paste code to format', 'inf'); return; }
            try {
                let ind = 0;
                const lines = editor.value.replace(/>\s*</g, '>\n<').split('\n');
                const out = [];
                lines.forEach(l => {
                    l = l.trim(); if (!l) return;
                    if (l.startsWith('</')) ind = Math.max(0, ind - 1);
                    out.push('  '.repeat(ind) + l);
                    if (l.startsWith('<') && !l.startsWith('</') && !l.startsWith('<?') && !l.endsWith('/>') && !l.includes('</')) ind++;
                });
                editor.value = out.join('\n'); updLn(); toast('Code formatted', 'ok');
            } catch (e) { toast('Format failed', 'err'); }
        };

        /* === Minify / Compress === */
        document.getElementById('minifyBtn').onclick = () => {
            if (!editor.value.trim()) { toast('Paste code to minify', 'inf'); return; }
            try {
                let code = editor.value;
                /* Remove XML comments */
                code = code.replace(/<!--[\s\S]*?-->/g, '');
                /* Remove excess whitespace */
                code = code.replace(/>\s+</g, '><');
                code = code.replace(/\s+/g, ' ');
                /* Remove unnecessary spaces around = and quotes */
                code = code.replace(/\s*=\s*"/g, '="');
                /* Trim */
                code = code.trim();
                editor.value = code;
                updLn();
                const before = editor.value.length;
                /* Re-parse to validate */
                render(code);
                toast('Minified! Saved ' + Math.round((1 - before/editor.value.length)*100) + '%', 'ok');
            } catch (e) { toast('Minify failed', 'err'); }
        };

        /* === Samples === */
        document.getElementById('sampleBtn').onclick = (e) => { e.stopPropagation(); sampleMenu.classList.toggle('open'); };
        document.addEventListener('click', () => sampleMenu.classList.remove('open'));
        document.querySelectorAll('.dd-item').forEach(it => {
            it.onclick = () => {
                const k = it.dataset.s; if (!samples[k]) return;
                editor.value = samples[k]; updLn(); render(samples[k]);
                sampleMenu.classList.remove('open'); toast('Sample loaded', 'ok');
            };
        });

        /* === Toast === */
        function toast(msg, type) {
            const ic = { ok: 'fa-solid fa-circle-check', err: 'fa-solid fa-circle-xmark', inf: 'fa-solid fa-circle-info' };
            const cl = { ok: 'ok', err: 'err', inf: 'inf' };
            const el = document.createElement('div');
            el.className = 'toast ' + (cl[type] || 'inf');
            el.innerHTML = '<i class="' + (ic[type] || ic.inf) + '"></i><span>' + msg + '</span>';
            tBox.appendChild(el);
            setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2500);
        }

        updLn();
    </script>
</body>
